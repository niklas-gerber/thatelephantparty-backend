services:
  backend:
    build: .
    restart: always
    # WICHTIG: 'ports' durch 'expose' ersetzt!
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL}
      - BASE_URL=${BASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_HOST=db # Verweist intern auf den Datenbank-Container
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - TZ=${TZ}
      # NGINX Proxy Variablen:
      - VIRTUAL_HOST=api.thatelephantparty.com
      - LETSENCRYPT_HOST=api.thatelephantparty.com
      - VIRTUAL_PORT=3000
    volumes:
      - ./logs:/backend/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - nginx-proxy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    # WICHTIG: 'ports' durch 'expose' ersetzt! Datenbank ist sicher!
    expose:
      - "5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

networks:
  nginx-proxy:
    external: true
